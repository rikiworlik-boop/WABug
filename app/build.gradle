plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wabug.syam'
    compileSdk 33
    defaultConfig {
        applicationId "com.wabug.syam"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    
    // Paksa Gradle nyari file Java di folder ini
    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

dependencies {
}
